name: Deploy Lambda Functions

on:
  push:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Set up AWS SAM CLI
        run: |
          pip install aws-sam-cli

      - name: Detect changed files
        id: changes
        run: |
          echo "::set-output name=changed_files::$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})"

      - name: Deploy to Dev
        if: github.ref == 'refs/heads/dev' && contains(steps.changes.outputs.changed_files, 'path/to/your/lambda/function')
        run: |
          sam package --template-file template.yaml --output-template-file packaged.yaml --s3-bucket ${{ secrets.DEV_S3_BUCKET_NAME }}
          sam deploy --template-file packaged.yaml --stack-name ${{ secrets.DEV_STACK_NAME }} --capabilities CAPABILITY_IAM
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: 'us-east-1'

      - name: Deploy to Prod
        if: github.ref == 'refs/heads/main' && contains(steps.changes.outputs.changed_files, 'path/to/your/lambda/function')
        run: |
          sam package --template-file template.yaml --output-template-file packaged.yaml --s3-bucket ${{ secrets.PROD_S3_BUCKET_NAME }}
          sam deploy --template-file packaged.yaml --stack-name ${{ secrets.PROD_STACK_NAME }} --capabilities CAPABILITY_IAM
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: 'us-east-1'