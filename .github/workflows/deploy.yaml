name: SAM Deploy Workflow

on:
  push:
    branches:
      - dev
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Node.js (if needed for dependencies)
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16' # Adjust based on your Node.js version

      # Step 3: Set up AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Replace with your AWS region

      # Step 4: Detect changed directories
      - name: Get changed Lambda directories
        id: get-changes
        run: |
          # Find which directories have changed
          CHANGED_DIRS=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | awk -F/ '{print $1}' | sort -u)
          echo "Changed directories: $CHANGED_DIRS"
          echo "::set-output name=dirs::$CHANGED_DIRS"

      # Step 5: Deploy each changed Lambda
      - name: Deploy SAM Lambdas
        env:
          SAM_CLI_TELEMETRY: 0
          ENV_PROFILE: ${{ github.ref_name == 'main' && echo 'prod' || echo 'dev' }}
        run: |
          for DIR in ${{ steps.get-changes.outputs.dirs }}; do
            if [ -f "$DIR/template.yaml" ]; then
              echo "Deploying Lambda function in $DIR"
              cd $DIR
              sam build
              sam deploy --profile $ENV_PROFILE --no-confirm-changeset --capabilities CAPABILITY_IAM
              cd -
            else
              echo "No template.yaml in $DIR, skipping..."
            fi
          done
