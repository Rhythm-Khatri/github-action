name: SAM Deploy Workflow

on:
  push:
    branches:
      - dev
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the repository with full history
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Fetch the full history to avoid shallow clones

      # Step 2: Set up Node.js (if needed for dependencies)
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16' # Adjust based on your Node.js version

      # Step 3: Set up AWS credentials for staging (dev branch)
      - name: Configure AWS credentials for staging
        if: github.ref == 'refs/heads/dev'
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_STAGING }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_STAGING }}
          aws-region: us-west-2 # Replace with your AWS region

      # Step 4: Set up AWS credentials for production (main branch)
      - name: Configure AWS credentials for production
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: us-west-2 # Replace with your AWS region

      # Step 5: Detect changed directories
      - name: Get changed Lambda directories
        id: get-changes
        run: |
          # Use HEAD~1 as a fallback if github.event.before is unavailable
          BASE_COMMIT=${{ github.event.before || 'HEAD~1' }}
          echo "Base commit: $BASE_COMMIT"

          # Find which directories have changed, excluding '.github'
          CHANGED_DIRS=$(git diff --name-only $BASE_COMMIT ${{ github.sha }} | awk -F/ '{print $1}' | grep -v '^\.github$' | sort -u)
          echo "Changed directories: $CHANGED_DIRS"
          echo "dirs=$CHANGED_DIRS" >> $GITHUB_ENV

      # Step 6: Deploy each changed Lambda
      - name: Deploy SAM Lambdas
        env:
          SAM_CLI_TELEMETRY: 0
          CHANGED_DIRS: ${{ env.dirs }}
        run: |
          # Determine the environment (dev or prod) and set the config file
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            DEPLOY_ENV="prod"
            CONFIG_FILE="samconfig-prod.toml"
          else
            DEPLOY_ENV="dev"
            CONFIG_FILE="samconfig-dev.toml"
          fi

          echo "Deploying to environment: $DEPLOY_ENV"
          
          for DIR in $CHANGED_DIRS; do
            if [ -f "$DIR/template.yaml" ]; then
              echo "Deploying Lambda function in $DIR"
              cd $DIR
              echo "Running sam build in $DIR"
              sam build
              if [ $? -ne 0 ]; then
                echo "sam build failed in $DIR"
                exit 1
              fi
              echo "Running sam deploy in $DIR for $DEPLOY_ENV environment using $CONFIG_FILE"
              sam deploy --no-confirm-changeset --no-fail-on-empty-changeset --config-file $CONFIG_FILE
              if [ $? -ne 0 ]; then
                echo "sam deploy failed in $DIR"
                exit 1
              fi
              cd -
            else
              echo "No template.yaml in $DIR, skipping..."
            fi
          done
